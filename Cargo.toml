[package]
name = "rust-ar-sticker"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.12", features = ["image", "tokio"] }
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"] }
ort = "=2.0.0-rc.10"
ndarray = "0.16"
log = "0.4"
env_logger = "0.11"
anyhow = "1"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
